name: 抓取海外中国古玉拍品

on:
  push:
    branches: ["claude/jade-auction-site-k53mke"]
    paths:                      # data/ 的回写不匹配这里，不会自触发
      - "scraper/**"
      - ".github/workflows/scrape-jade.yml"
  schedule:
    - cron: "17 */3 * * *"      # 只在默认分支生效，合入 main 后开始自动跑
  workflow_dispatch:
    inputs:
      mode:
        description: "scrape（正式抓取）或 probe（只探测响应特征）"
        type: choice
        options: [scrape, probe]
        default: scrape
      only:
        description: "只跑指定源，逗号分隔（留空 = 全部）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-jade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      # push 默认只跑探测（76 个源，真浏览器逐个打开很慢）；
      # 提交信息里带 [scrape] 才顺带正式抓取一轮。
      # 探测很慢（76 源 × 真浏览器），默认不跑；
      # 需要时在提交信息里写 [probe]，或手动 dispatch 选 probe。
      - name: 探测各源响应特征
        if: >-
          inputs.mode == 'probe' ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[probe]'))
        continue-on-error: true
        run: python scraper/core.py --probe ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      - name: 正式抓取
        if: inputs.mode != 'probe'
        run: python scraper/core.py ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      - name: 上传探测样本
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-and-data
          path: |
            data/probe.txt
            data/lots.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 提交数据
        if: inputs.mode != 'probe' 
        run: |
          git config user.name  "jade-scraper[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/lots.json data/lots.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            COUNT=$(python -c "import json;print(json.load(open('data/lots.json'))['count'])")
            git commit -m "data: 刷新海外中国古玉在拍数据（$COUNT 条）"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break
              echo "推送失败，$((2**i))s 后重试"; sleep $((2**i))
            done
          fi
