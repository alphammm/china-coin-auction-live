# ══════════════════════════════════════════════════════════════════════════
# 海外（中国大陆以外）中国古玉 / 翡翠 拍卖源
#
# 覆盖策略：聚合平台保广度（HiBid / Proxibid / the-saleroom / i-bidder /
# Invaluable / LiveAuctioneers / Auctionet / Interencheres 等本身就聚合了
# 成百上千家欧美中小拍行）+ 亚洲艺术专业行保深度（Nagel / Zacke / Lempertz /
# Van Ham / Koller / Dorotheum / Uppsala / iGavel / Clars 等）。
#
# browser: true  → 走 Playwright 真浏览器（首轮探测证明多数拍行的检索结果是
#                  前端渲染的，requests 抓到的 HTML 里一条拍品都没有）
# probe_url      → 探测时改用这个地址（搜索 URL 尚未确认的源先探首页，
#                  用「站内链接形态 TOP」反推真实的 lot 链接规律）
# lot_url_pattern→ 兜底解析：符合此正则的链接即视为一个拍品
# ══════════════════════════════════════════════════════════════════════════
sources:
- id: auctionet
  name: Auctionet（北欧 ~150 家）
  region: 欧陆
  country: SE
  home: https://auctionet.com/
  url: https://auctionet.com/en/search?q={q}&is_ended=0&page={page}
  queries:
  - chinese jade
