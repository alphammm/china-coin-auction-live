# ══════════════════════════════════════════════════════════════════════════
# 海外（中国大陆以外）中国古玉 / 翡翠 拍卖源
#
# 字段说明
#   id/name/region/country  展示与分组用
#   method    html（默认）| json
#   url       {q}=URL 编码关键词  {q_raw}=原文  {page}=页码
#   queries   该源要跑的检索词（越精准越少噪音）
#   pages     每个词翻几页
#   item      每个拍品卡片的 CSS 选择器（可给数组，依次尝试）
#   fields    卡片内取值："css | text" / "css | attr:href"
#   json      method=json 时的取值路径（点号路径，数字表示数组下标）
#   lot_url_pattern  兜底策略：符合此正则的链接即视为一个拍品
#
# 选择器多为首版推测值 —— 以 GitHub Actions 上 `--probe` 的真实响应为准逐个校正。
# 解析器会自动降级：configured → jsonld → links，健康报告里会写明实际命中哪一级。
# ══════════════════════════════════════════════════════════════════════════
sources:

  # ───────────────────────── 聚合平台 ─────────────────────────
  - id: auctionet
    name: Auctionet
    region: 欧陆
    country: SE
    home: https://auctionet.com/
    url: "https://auctionet.com/en/search?q={q}&is_ended=0&page={page}"
    queries: ["chinese jade", "jade carving china", "jadeite chinese", "nephrite chinese"]
    pages: 2
    item: ["div.item-container", "article.item", "li.item"]
    fields:
      title: "h3 a | text"
      url: "h3 a | attr:href"
      image: "img | attr:src"
      price: ".item-bid, .bid | text"
      end: "time | attr:datetime"
      house: ".item-auction-house, .auction-house | text"
    lot_url_pattern: "auctionet\\.com/[a-z]{2}/\\d+"

  - id: barnebys
    name: Barnebys
    region: 聚合
    country: SE
    home: https://www.barnebys.com/
    url: "https://www.barnebys.com/search?q={q}&sort=ending"
    queries: ["chinese jade", "jade cong", "chinese jadeite"]
    pages: 2
    item: ["div[data-testid='lot-card']", "article", "div.lot-card"]
    fields:
      title: "a | text"
      url: "a | attr:href"
      image: "img | attr:src"
    lot_url_pattern: "barnebys\\.com/(auctions/lot|realized-prices|lot)/"

